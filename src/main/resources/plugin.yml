name: YouTubeMusic
author: Hyung + OpenAI
description: Hệ thống âm nhạc YouTube cho Paper 26.2+, UI Java + Bedrock kiểu Spotify, thư viện cá nhân và tìm kiếm YouTube.
version: 2.12.0
main: vn.youtubemusic.YouTubeMusicPlugin
api-version: '26.2'
website: https://github.com/Truc5738/YouTubeMusic-Paper
depend: [floodgate]
softdepend: [Geyser-Spigot, ViaVersion, ViaBackwards]
commands:
  music:
    description: Mở và quản lý YouTube Music
    usage: /music [play|queue|skip|stop|volume|loop|shuffle|radio|favorite|favorites|history|search|playfavorite|playhistory|clearhistory|status|lyrics|say|help]
    aliases: [ytmusic, nhac]
    permission: youtubemusic.use
    permission-message: "§cBạn không có quyền dùng YouTube Music."
permissions:
  youtubemusic.use: {default: true}
  youtubemusic.play: {default: true}
  youtubemusic.control: {default: true}
  youtubemusic.bypass: {default: op}
  youtubemusic.admin: {default: op}
