# YouTubeMusic 2.12.0 — API Edition + Spotify-style UI + private synced lyrics
lyrics:
  enabled: true
  directory: "lyrics"
  format: "lrc"
  private-chat: true

ui:
  enabled: true
  bedrock-forms: true
  java-inventory: true

queue:
  max-size: 25
  loop: false
  shuffle: false
  radio: false

request:
  cooldown-seconds: 5

security:
  max-url-length: 2048
  max-track-duration-seconds: 3600
  allow-youtube-only: true

player:
  default-volume: 80
  max-volume: 100

storage:
  file: music.db

audio:
  backend: api-resource-pack
  max-duration-seconds: 3600
  default-duration-seconds: 600

  # Plugin tự mở HTTP Audio API bằng JDK trên TCP 26467.
  # UDP 26467 vẫn có thể do Geyser/Simple Voice Chat sử dụng.
  local-api:
    enabled: true
    bind: "0.0.0.0"
    port: 26467

  # ApiAudioBackend gọi API nội bộ này; không cần truy cập DNS public.
  api:
    url: "http://127.0.0.1:26467/"
    key: ""
    bitrate: "128"
    timeout-seconds: 120

  # Đây là resolver externo que LocalAudioApiServer proxy. Phải là một
  # Cobalt-compatible API được phép sử dụng; plugin không cài FFmpeg/yt-dlp.
  resolver:
    url: ""
    key: ""
    timeout-seconds: 120

  youtube-data-api-key: ""
  download-timeout-seconds: 300
  resource-pack-url-template: "http://YOUR_PUBLIC_IP:8126/packs/%s"
  resource-pack-required: false
  resource-pack-timeout-seconds: 90
  resource-pack-https-recommended: true
  play-delay-ticks: 60
  resource-pack-server:
    enabled: true
  resource-pack-server-port: 8126
  cache-directory: "audio-cache"
