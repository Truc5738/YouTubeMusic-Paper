# YouTubeMusic 2.12.0 — API Edition + Spotify-style UI + private synced lyrics
lyrics:
  enabled: true
  directory: "lyrics"
  format: "lrc"
  private-chat: true

ui:
  enabled: true
  bedrock-forms: true
  java-inventory: true

queue:
  max-size: 25
  loop: false
  shuffle: false
  radio: false

request:
  cooldown-seconds: 5

security:
  max-url-length: 2048
  max-track-duration-seconds: 3600
  allow-youtube-only: true

player:
  default-volume: 80
  max-volume: 100

storage:
  file: music.db

audio:
  backend: api-resource-pack
  max-duration-seconds: 3600
  default-duration-seconds: 600

  # Shared JDK HTTP server. TCP 26467 may use the same number as UDP 26467.
  local-api:
    enabled: true
    bind: "0.0.0.0"
    port: 26467

  # Internal bridge used by ApiAudioBackend.
  api:
    url: "http://127.0.0.1:26467/api/audio"
    key: ""
    bitrate: "128"
    timeout-seconds: 120

  # Cobalt-compatible resolver. Required for actual YouTube audio resolution.
  resolver:
    url: ""
    key: ""
    timeout-seconds: 120

  youtube-data-api-key: ""
  download-timeout-seconds: 300

  # Public TCP URL that Minecraft Java clients can reach.
  # Replace YOUR_PUBLIC_IP with your host/domain.
  resource-pack-url-template: "http://YOUR_PUBLIC_IP:26467/packs/%s"
  resource-pack-required: false
  resource-pack-timeout-seconds: 90
  resource-pack-https-recommended: true
  play-delay-ticks: 60

  # Deprecated separate pack-server settings are kept only for compatibility.
  # Resource packs are now served by local-api on TCP 26467.
  resource-pack-server:
    enabled: false
  resource-pack-server-port: 8126

  cache-directory: "audio-cache"
